name: Scrape Octopus Energy Free Electricity

on:
  schedule:
    # Run every 3 hours at minute 0
    - cron: '0 */3 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [ main, master ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'config.yaml.example'
      - 'gh-pages-src/**'

concurrency:
  group: octocal-scraper
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Fetch gh-pages branch
      id: fetch-gh-pages
      run: |
        if git fetch --depth=1 origin gh-pages:gh-pages 2>/dev/null && git rev-parse --verify gh-pages >/dev/null 2>&1; then
          echo "has_gh_pages=true" >> "$GITHUB_OUTPUT"
          echo "Fetched gh-pages branch"
        else
          echo "has_gh_pages=false" >> "$GITHUB_OUTPUT"
          echo "gh-pages branch not available"
        fi

    - name: Determine run mode
      id: run-mode
      run: |
        RUN_SCRAPER=true
        MODE_REASON="non-push trigger"

        if [ "$GITHUB_EVENT_NAME" = "push" ]; then
          # For push events, skip scraper only when every changed file is static content.
          RUN_SCRAPER=false
          HAS_FILES=false
          PAYLOAD_TOO_LARGE=false
          while IFS= read -r token; do
            [ -n "$token" ] || continue
            case "$token" in
              __PAYLOAD_TOO_LARGE__)
                PAYLOAD_TOO_LARGE=true
                break
                ;;
              *)
                HAS_FILES=true
                case "$token" in
                  gh-pages-src/*) ;;
                  *)
                    RUN_SCRAPER=true
                    MODE_REASON="push includes non-static changes ($token)"
                    break
                    ;;
                esac
                ;;
            esac
          done < <(python3 << 'PY'
        import json
        import os

        event_path = os.environ.get('GITHUB_EVENT_PATH')
        if not event_path:
            raise SystemExit(0)

        with open(event_path, 'r', encoding='utf-8') as fh:
            payload = json.load(fh)

        commits = payload.get('commits', [])
        if payload.get('size', len(commits)) > len(commits):
            print('__PAYLOAD_TOO_LARGE__')
            raise SystemExit(0)

        for commit in commits:
            for key in ('added', 'modified', 'removed'):
                for file in commit.get(key, []):
                    print(file)
        PY
          )

          if [ "$PAYLOAD_TOO_LARGE" = "true" ]; then
            RUN_SCRAPER=true
            MODE_REASON="push payload truncated; running scraper for safety"
          elif [ "$RUN_SCRAPER" = "false" ]; then
            if [ "$HAS_FILES" = "true" ]; then
              if [ "${{ steps.fetch-gh-pages.outputs.has_gh_pages }}" = "true" ]; then
                MODE_REASON="push with static-only changes"
              else
                RUN_SCRAPER=true
                MODE_REASON="gh-pages missing; running scraper to generate data artifacts"
              fi
            else
              # Safety fallback when changed files are unavailable.
              RUN_SCRAPER=true
              MODE_REASON="push file list unavailable"
            fi
          fi
        fi

        echo "run_scraper=$RUN_SCRAPER" >> "$GITHUB_OUTPUT"
        echo "reason=$MODE_REASON" >> "$GITHUB_OUTPUT"
        echo "Run mode: run_scraper=$RUN_SCRAPER ($MODE_REASON)"

    - name: Set up Python
      if: steps.run-mode.outputs.run_scraper == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - uses: astral-sh/setup-uv@v4
      if: steps.run-mode.outputs.run_scraper == 'true'
      with:
        enable-cache: true
        cache-dependency-glob: requirements.txt

    - name: Install dependencies
      if: steps.run-mode.outputs.run_scraper == 'true'
      env:
        UV_SYSTEM_PYTHON: 1
      run: |
        uv pip install -r requirements.txt

    - name: Prepare history data
      if: steps.run-mode.outputs.run_scraper == 'true'
      run: |
        mkdir -p output
        # Priority 1: Use committed seed data if available
        if [ -f gh-pages-data/history.json ]; then
          cp gh-pages-data/history.json output/history.json
          echo "Using seed history.json from gh-pages-data/"
        # Priority 2: Download existing from gh-pages branch
        elif [ "${{ steps.fetch-gh-pages.outputs.has_gh_pages }}" = "true" ] && git show gh-pages:history.json > output/history.json 2>/dev/null; then
          echo "Downloaded existing history.json from gh-pages branch"
        else
          echo "No existing history.json found, will create new one"
        fi

    - name: Run scraper
      if: steps.run-mode.outputs.run_scraper == 'true'
      run: |
        set -o pipefail
        ATTEMPTS=2
        for i in $(seq 1 $ATTEMPTS); do
          echo "::group::Attempt $i of $ATTEMPTS"
          if python main.py --single-run; then
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"
          if [ "$i" -lt "$ATTEMPTS" ]; then
            sleep $((i * 10))
          fi
        done
        echo "All scraper attempts failed"
        exit 1

    - name: Prepare GitHub Pages content
      run: |
        mkdir -p gh-pages-deploy
        # Copy HTML webpages
        cp gh-pages-src/index.html gh-pages-deploy/
        cp gh-pages-src/history.html gh-pages-deploy/
        # Copy thumbnail images if they exist
        if [ -f gh-pages-src/home.thumbnail.jpeg ]; then
          cp gh-pages-src/home.thumbnail.jpeg gh-pages-deploy/
        fi
        if [ -f gh-pages-src/history.thumbnail.jpeg ]; then
          cp gh-pages-src/history.thumbnail.jpeg gh-pages-deploy/
        fi

        if [ "${{ steps.run-mode.outputs.run_scraper }}" = "true" ]; then
          # Scraper mode: use freshly generated artifacts.
          cp output/octopus_free_electricity.ics gh-pages-deploy/
          if [ -f output/history.json ]; then
            cp output/history.json gh-pages-deploy/
          else
            echo '{"sessions": [], "last_updated": null}' > gh-pages-deploy/history.json
          fi
          if [ -f output/upcoming_sessions.json ]; then
            cp output/upcoming_sessions.json gh-pages-deploy/
          else
            echo '{"upcoming_sessions": [], "last_updated": null}' > gh-pages-deploy/upcoming_sessions.json
          fi
        else
          # Static-only mode: reuse existing published data to avoid scraping work.
          if [ "${{ steps.fetch-gh-pages.outputs.has_gh_pages }}" = "true" ] && git show gh-pages:octopus_free_electricity.ics > gh-pages-deploy/octopus_free_electricity.ics 2>/dev/null; then
            echo "Reused octopus_free_electricity.ics from gh-pages"
          else
            printf 'BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//OctoCal//EN\nEND:VCALENDAR\n' > gh-pages-deploy/octopus_free_electricity.ics
          fi
          if [ "${{ steps.fetch-gh-pages.outputs.has_gh_pages }}" = "true" ] && git show gh-pages:history.json > gh-pages-deploy/history.json 2>/dev/null; then
            echo "Reused history.json from gh-pages"
          else
            echo '{"sessions": [], "last_updated": null}' > gh-pages-deploy/history.json
          fi
          if [ "${{ steps.fetch-gh-pages.outputs.has_gh_pages }}" = "true" ] && git show gh-pages:upcoming_sessions.json > gh-pages-deploy/upcoming_sessions.json 2>/dev/null; then
            echo "Reused upcoming_sessions.json from gh-pages"
          else
            echo '{"upcoming_sessions": [], "last_updated": null}' > gh-pages-deploy/upcoming_sessions.json
          fi
        fi

    - name: Check for changes
      id: check-changes
      env:
        HAVE_GH_PAGES: ${{ steps.fetch-gh-pages.outputs.has_gh_pages }}
      run: python3 .github/scripts/check-changes.py

    - name: Deploy to GitHub Pages
      if: steps.check-changes.outputs.changed == 'true'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages-deploy
        publish_branch: gh-pages
        force_orphan: false
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Update calendar and data'
